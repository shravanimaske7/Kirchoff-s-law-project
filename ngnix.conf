# High-concurrency Nginx configuration for WebGL & Simulation Labs
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Kernel-level zero-copy file transfer (bypasses userspace memory copy)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Connection pooling & keepalive
    keepalive_timeout 65;
    keepalive_requests 1000;
    reset_timedout_connection on;
    client_body_timeout 10;
    send_timeout 10;

    # Open file descriptor caching to avoid repeated disk reads
    open_file_cache max=5000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Gzip Compression: drastically cuts initial load payload (Three.js & CSS)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml;

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Disable access logging for high-volume asset requests
        access_log off;
        error_log /var/log/nginx/error.log crit;

        # Immutable caching for static scripts & Three.js CDN assets
        location ~* \.(?:css|js|woff2?|svg|png|jpg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            log_not_found off;
        }

        # HTML: Cache validation via ETag
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}